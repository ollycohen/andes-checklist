name: Daily Email Update

on:
  schedule:
    # 6:00 AM Pacific (13:00 UTC) every day
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Email mode"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - weekly

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install resend

      - name: Send daily email
        env:
          API_TOKEN: ${{ secrets.CHECKLIST_SYNC_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: node scripts/daily-email.js
